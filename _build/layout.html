<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Ativa as animações de entrada antes da primeira pintura e as desativa
     novamente caso o site.js não carregue (garante conteúdo sempre visível). */
  document.documentElement.classList.add('js');
  setTimeout(function () {
    if (!window.__ILUMINATO_ATIVO__) document.documentElement.classList.remove('js');
  }, 4000);
</script>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#3B4D4D">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Iluminato — Espaço de Eventos">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:alt" content="Casal celebrando o casamento no Iluminato Espaço de Eventos">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<link rel="icon" href="assets/img/logo-iluminato.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="assets/img/logo-iluminato.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">

<!-- TROCAR: nome, telefone, endereço, horário e coordenadas do espaço -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EventVenue",
  "name": "Iluminato — Espaço de Eventos",
  "description": "Espaço de eventos para casamentos, celebrações e encontros corporativos, com arquitetura contemporânea, paisagismo e estrutura completa.",
  "url": "{{CANONICAL}}",
  "logo": "{{BASE}}assets/img/logo-iluminato.jpg",
  "image": "{{BASE}}assets/img/hero-casal-1440.jpg",
  "telephone": "+55-00-0000-0000",
  "email": "contato@seudominio.com.br",
  "priceRange": "$$$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Rua Exemplo, 000 — Bairro",
    "addressLocality": "[Cidade]",
    "addressRegion": "[UF]",
    "postalCode": "00000-000",
    "addressCountry": "BR"
  },
  "geo": { "@type": "GeoCoordinates", "latitude": 0.0000, "longitude": 0.0000 },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
    "opens": "09:00",
    "closes": "19:00"
  }],
  "sameAs": ["https://www.instagram.com/seuperfil/"],
  "areaServed": "[Cidade]"
}
</script>
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
{{HEADER}}
<main id="conteudo">
{{CONTENT}}
</main>
{{FOOTER}}
<script src="js/site.js" defer></script>
</body>
</html>
